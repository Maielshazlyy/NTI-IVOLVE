---
- name: Configure Docker, kubectl, and Jenkins on the managed worker
  hosts: managed
  become: true
  gather_facts: true

  tasks:
    - name: Install Docker, kubectl, and Java 21
      ansible.builtin.apt:
        name:
          - docker.io
          - kubectl
          - fontconfig
          - openjdk-21-jre
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Ensure Docker is enabled and running
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Create apt keyring directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Download the official Jenkins LTS signing key
      ansible.builtin.get_url:
        url: https://pkg.jenkins.io/debian-stable/jenkins.io-2026.key
        dest: /etc/apt/keyrings/jenkins-keyring.asc
        mode: "0644"

    - name: Configure the official Jenkins LTS apt repository
      ansible.builtin.apt_repository:
        repo: "deb [signed-by=/etc/apt/keyrings/jenkins-keyring.asc] https://pkg.jenkins.io/debian-stable binary/"
        filename: jenkins
        state: present

    - name: Refresh apt cache for Jenkins repository
      ansible.builtin.apt:
        update_cache: true

    - name: Install Jenkins without starting it before memory settings are applied
      ansible.builtin.apt:
        name: jenkins
        state: present
        policy_rc_d: 101
      environment:
        DEBIAN_FRONTEND: noninteractive

    - name: Create Jenkins systemd override directory
      ansible.builtin.file:
        path: /etc/systemd/system/jenkins.service.d
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Add a small-worker memory limit for Jenkins
      ansible.builtin.copy:
        dest: /etc/systemd/system/jenkins.service.d/override.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          [Service]
          Environment="JAVA_OPTS=-Djava.awt.headless=true -Xms128m -Xmx256m"
      notify: Reload systemd and restart Jenkins

    - name: Reload systemd and start Jenkins
      ansible.builtin.systemd:
        name: jenkins
        daemon_reload: true
        enabled: true
        state: started

    - name: Wait for Jenkins login page to respond
      ansible.builtin.uri:
        url: http://127.0.0.1:8080/login
        status_code: 200
      register: jenkins_http
      retries: 18
      delay: 10
      until: jenkins_http.status == 200

    - name: Read Docker version
      ansible.builtin.command: docker --version
      register: docker_version
      changed_when: false

    - name: Read kubectl client version
      ansible.builtin.command: kubectl version --client
      register: kubectl_version
      changed_when: false

    - name: Read Java version
      ansible.builtin.command: java -version
      register: java_version
      changed_when: false

    - name: Read Jenkins service state
      ansible.builtin.command: systemctl is-active jenkins
      register: jenkins_service_state
      changed_when: false

    - name: Display verification results
      ansible.builtin.debug:
        msg:
          - "{{ docker_version.stdout }}"
          - "{{ kubectl_version.stdout }}"
          - "{{ java_version.stderr_lines[0] }}"
          - "Jenkins service: {{ jenkins_service_state.stdout }}"
          - "Jenkins HTTP status: {{ jenkins_http.status }}"

  handlers:
    - name: Reload systemd and restart Jenkins
      ansible.builtin.systemd:
        name: jenkins
        daemon_reload: true
        enabled: true
        state: restarted
