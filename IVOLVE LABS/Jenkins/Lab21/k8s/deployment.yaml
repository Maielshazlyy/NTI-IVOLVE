apiVersion: apps/v1
kind: Deployment
metadata:
  name: ivolveapp
  namespace: ivolve
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ivolveapp
  template:
    metadata:
      labels:
        app: ivolveapp
    spec:
      nodeSelector:
        project: ivolve
      tolerations:
        - key: workload
          operator: Equal
          value: ivolveApp
          effect: NoSchedule
      initContainers:
        - name: initialize-database
          image: mysql:8.0
          command:
            - /bin/sh
            - -ec
            - |
              until mysqladmin ping --host="$DB_HOST" --user=root --password="$MYSQL_ROOT_PASSWORD" --silent; do
                echo "Waiting for MySQL..."
                sleep 2
              done
              mysql --host="$DB_HOST" --user=root --password="$MYSQL_ROOT_PASSWORD" \
                -e "CREATE DATABASE IF NOT EXISTS ivolve;
                    CREATE USER IF NOT EXISTS '${DB_USER}'@'%' IDENTIFIED BY '${DB_PASSWORD}';
                    ALTER USER '${DB_USER}'@'%' IDENTIFIED BY '${DB_PASSWORD}';
                    GRANT ALL PRIVILEGES ON ivolve.* TO '${DB_USER}'@'%';
                    FLUSH PRIVILEGES;"
          env:
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: ivolvcm
                  key: DB_HOST
            - name: DB_USER
              valueFrom:
                configMapKeyRef:
                  name: ivolvcm
                  key: DB_USER
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ivolvesecret
                  key: MYSQL_ROOT_PASSWORD
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ivolvesecret
                  key: DB_PASSWORD
      containers:
        - name: ivolve-app
          image: maielshazly/ivolve-app:lab8
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: ivolvcm
                  key: DB_HOST
            - name: DB_USER
              valueFrom:
                configMapKeyRef:
                  name: ivolvcm
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ivolvesecret
                  key: DB_PASSWORD
            - name: DB_NAME
              value: ivolve
          volumeMounts:
            - name: app-logs
              mountPath: /app/logs
      volumes:
        - name: app-logs
          persistentVolumeClaim:
            claimName: ivolvepvc
